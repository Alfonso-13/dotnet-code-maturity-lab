<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="title desc">
  <title id="title">Comparación visual de código antes y después</title>
  <desc id="desc">Dos editores de código conectados por una flecha, con riesgos en rojo y mejoras en verde.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".22"/></filter></defs>
  <rect width="640" height="230" rx="18" fill="#172129"/>
  <g filter="url(#shadow)">
    <rect x="34" y="28" width="238" height="174" rx="10" fill="#0d141a" stroke="#3d4850"/>
    <rect x="368" y="28" width="238" height="174" rx="10" fill="#f7f8f9" stroke="#d8dde0"/>
  </g>
  <g fill="#6e7a83"><circle cx="54" cy="48" r="5" fill="#e53935"/><circle cx="70" cy="48" r="5"/><circle cx="86" cy="48" r="5"/></g>
  <g fill="#a6afb5"><circle cx="388" cy="48" r="5" fill="#198754"/><circle cx="404" cy="48" r="5"/><circle cx="420" cy="48" r="5"/></g>
  <g font-family="Consolas,monospace" font-size="13">
    <text x="52" y="82" fill="#ff7772">OrderService</text><text x="146" y="82" fill="#dce2e6">.Process()</text>
    <rect x="51" y="97" width="185" height="20" rx="3" fill="#542523"/><text x="61" y="112" fill="#ffc2bf">validate + save + notify</text>
    <rect x="51" y="126" width="162" height="20" rx="3" fill="#542523"/><text x="61" y="141" fill="#ffc2bf">discount + database</text>
    <rect x="51" y="155" width="118" height="20" rx="3" fill="#542523"/><text x="61" y="170" fill="#ffc2bf">send email</text>
    <text x="386" y="83" fill="#bd2623">OrderProcessor</text><text x="493" y="83" fill="#28343c">.Run()</text>
    <rect x="386" y="98" width="159" height="20" rx="3" fill="#e8f6ef"/><text x="397" y="113" fill="#116b42">validator.Validate()</text>
    <rect x="386" y="127" width="174" height="20" rx="3" fill="#e8f6ef"/><text x="397" y="142" fill="#116b42">repository.SaveAsync()</text>
    <rect x="386" y="156" width="161" height="20" rx="3" fill="#e8f6ef"/><text x="397" y="171" fill="#116b42">notifier.SendAsync()</text>
  </g>
  <g fill="none" stroke="#e53935" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M294 105h52"/><path d="m332 91 14 14-14 14"/></g>
  <g font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1"><text x="52" y="193" fill="#ff7772">ANTES · 3 RIESGOS</text><text x="386" y="193" fill="#198754">DESPUÉS · RESPONSABILIDADES CLARAS</text></g>
</svg>
