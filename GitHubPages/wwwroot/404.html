<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>.NET Code Maturity Lab</title>
    <script>
        const pathSegmentsToKeep = 1;
        const location = window.location;
        const repositoryRoot = location.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/");
        const route = location.pathname.split("/").slice(1 + pathSegmentsToKeep).join("/").replace(/&/g, "~and~");
        const query = location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "";
        location.replace(location.protocol + "//" + location.hostname + (location.port ? ":" + location.port : "") + repositoryRoot + "/?/" + route + query + location.hash);
    </script>
</head>
<body></body>
</html>
